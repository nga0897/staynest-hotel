services:
  - type: web
    name: salabaonguyen-hotel
    runtime: node
    startCommand: npm start
    buildCommand: npm install
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
