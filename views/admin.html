<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị | Bảo Nguyên Hotel</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-body">
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">✦</span>Bảo Nguyên Hotel</a>
    <a class="header-action" href="/">Xem trang khách ↗</a>
  </header>

  <main class="admin-main">
    <div class="admin-title">
      <div>
        <p class="eyebrow">CONTENT MANAGER</p>
        <h1>Quản trị<br><em>khách sạn.</em></h1>
      </div>
      <span id="saveStatus">Đang tải dữ liệu...</span>
    </div>

    <form id="hotelForm" class="admin-form">
      <section class="admin-panel">
        <div class="panel-label">01 / THÔNG TIN CHUNG</div>
        <div class="form-grid">
          <label>Tiếng Việt - Tên khách sạn<input name="name_vi" required></label>
          <label>Tiếng Trung - Tên khách sạn<input name="name_zh" required></label>
          <label>Tiếng Hàn - Tên khách sạn<input name="name_ko" required></label>

          <label>Tiếng Việt - Địa điểm<input name="location_vi" required></label>
          <label>Tiếng Trung - Địa điểm<input name="location_zh" required></label>
          <label>Tiếng Hàn - Địa điểm<input name="location_ko" required></label>

          <label class="wide">Tiếng Việt - Địa chỉ khách sạn<input name="address_vi" required></label>
          <label class="wide">Tiếng Trung - Địa chỉ khách sạn<input name="address_zh" required></label>
          <label class="wide">Tiếng Hàn - Địa chỉ khách sạn<input name="address_ko" required></label>

          <label class="wide">Tiếng Việt - Tagline<input name="tagline_vi" required></label>
          <label class="wide">Tiếng Trung - Tagline<input name="tagline_zh" required></label>
          <label class="wide">Tiếng Hàn - Tagline<input name="tagline_ko" required></label>

          <label class="wide">Tiếng Việt - Mô tả<textarea name="description_vi" rows="4" required></textarea></label>
          <label class="wide">Tiếng Trung - Mô tả<textarea name="description_zh" rows="4" required></textarea></label>
          <label class="wide">Tiếng Hàn - Mô tả<textarea name="description_ko" rows="4" required></textarea></label>

          <label class="wide">Ảnh hero</label>
          <div class="image-upload wide">
            <input name="heroImage" type="text" placeholder="Dán URL ảnh hoặc chọn file bên dưới" required>
            <input id="heroImageFile" type="file" accept="image/*">
            <img id="heroPreview" class="upload-preview hidden" alt="Xem trước ảnh hero">
          </div>
        </div>
      </section>

      <section class="admin-panel">
        <div class="panel-label">02 / TIỆN NGHI</div>
        <div class="form-grid">
          <label class="wide">Tiếng Việt - Danh sách tiện nghi <small>(mỗi tiện nghi một dòng)</small>
            <textarea name="amenities_vi" rows="5"></textarea>
          </label>
          <label class="wide">Tiếng Trung - Danh sách tiện nghi <small>(mỗi tiện nghi một dòng)</small>
            <textarea name="amenities_zh" rows="5"></textarea>
          </label>
          <label class="wide">Tiếng Hàn - Danh sách tiện nghi <small>(mỗi tiện nghi một dòng)</small>
            <textarea name="amenities_ko" rows="5"></textarea>
          </label>
        </div>
      </section>

      <section class="admin-panel">
        <div class="panel-label">03 / LIÊN HỆ</div>
        <div class="form-grid">
          <label>Email<input name="contact" type="email" required></label>
          <label>Số điện thoại<input name="phone" required></label>
          <label class="wide">Fanpage Facebook<input name="facebook" type="url" placeholder="https://facebook.com/"></label>
          <label class="wide">Đường dẫn Google Maps<input name="googleMap" type="url" placeholder="https://maps.google.com/"></label>
          <label class="wide">Video giới thiệu khách sạn</label>
          <div class="image-upload wide">
            <input name="video" type="text" placeholder="Dán URL video hoặc chọn file dưới đây">
            <input id="videoFile" type="file" accept="video/*">
            <video id="videoPreview" class="upload-preview hidden" controls playsinline></video>
          </div>
          <label class="wide">Ảnh Webchat</label>
          <div class="image-upload wide">
            <input name="webchatImage" type="text" placeholder="Dán URL ảnh hoặc chọn file dưới đây">
            <input id="webchatImageFile" type="file" accept="image/*">
            <img id="webchatPreview" class="upload-preview hidden" alt="Xem trước ảnh webchat">
          </div>
        </div>
      </section>

      <button class="save-button" type="submit">Lưu thay đổi <span>↗</span></button>
    </form>

    <section class="rooms-admin">
      <div class="admin-title rooms-title">
        <div>
          <p class="eyebrow">ROOM INVENTORY</p>
          <h2>Phòng nghỉ</h2>
        </div>
        <button id="toggleRoomForm" class="outline-button" type="button">+ Thêm phòng</button>
      </div>

      <form id="roomForm" class="room-form hidden">
        <input name="name_vi" placeholder="Tên phòng (Tiếng Việt)" required>
        <input name="name_zh" placeholder="Tên phòng (Tiếng Trung)" required>
        <input name="name_ko" placeholder="Tên phòng (Tiếng Hàn)" required>
        <input name="price" placeholder="Giá / đêm" required>
        <input name="size" placeholder="Diện tích" required>
        <div class="image-upload">
          <input name="image" type="text" placeholder="Dán URL ảnh hoặc chọn file">
          <input id="roomImageFile" type="file" accept="image/*">
          <img id="roomPreview" class="upload-preview hidden" alt="Xem trước ảnh phòng">
        </div>
        <textarea name="description_vi" placeholder="Mô tả phòng (Tiếng Việt)" required></textarea>
        <textarea name="description_zh" placeholder="Mô tả phòng (Tiếng Trung)" required></textarea>
        <textarea name="description_ko" placeholder="Mô tả phòng (Tiếng Hàn)" required></textarea>
        <button class="save-button" type="submit">Thêm phòng <span>↗</span></button>
      </form>

      <div id="adminRooms" class="admin-rooms"></div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
